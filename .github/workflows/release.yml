name: Build and Release Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Derive versions
        id: versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG" =~ ^(0|[1-9][0-9]{0,8})(\.(0|[1-9][0-9]{0,8})){0,3}$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not map to a valid AMO version ('${TAG}')."
            exit 1
          fi
          PKG_VER="$(node -p "require('./package.json').version")"
          SEGMENTS="$(awk -F. '{print NF}' <<< "$TAG")"
          if [ "$SEGMENTS" -eq 4 ]; then
            MODE="unlisted"
            UNLISTED="$TAG"
            if [ "${TAG%.*}" != "$PKG_VER" ]; then
              echo "::error::Tag '${TAG}' must extend package.json version '${PKG_VER}' (e.g. ${PKG_VER}.1)."
              exit 1
            fi
          else
            MODE="full"
            if [ "$TAG" != "$PKG_VER" ]; then
              echo "::error::Tag version '${TAG}' does not match package.json version '${PKG_VER}'."
              exit 1
            fi
            UNLISTED="${TAG}.0"
          fi
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "unlisted=${UNLISTED}" >> "$GITHUB_OUTPUT"

      - name: Build extensions and packages
        if: ${{ steps.versions.outputs.mode == 'full' }}
        run: pnpm build
        env:
          VOLUMUTE_RELEASE: "1"

      - name: Package source code
        if: ${{ steps.versions.outputs.mode == 'full' }}
        run: git archive --format=zip -o dist/volumute-source.zip HEAD

      - name: Submit Firefox version to AMO (listed)
        if: ${{ steps.versions.outputs.mode == 'full' }}
        run: |
          pnpm exec web-ext sign \
            --channel=listed \
            --approval-timeout=0 \
            --source-dir dist/firefox \
            --upload-source-code dist/volumute-source.zip \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET"
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}

      - name: Build unlisted Firefox package
        run: pnpm exec vite build
        env:
          VOLUMUTE_TARGET: firefox
          VOLUMUTE_RELEASE: "1"
          VOLUMUTE_VERSION: ${{ steps.versions.outputs.unlisted }}

      - name: Build Chrome package (unlisted-only)
        if: ${{ steps.versions.outputs.mode == 'unlisted' }}
        run: pnpm build:chrome
        env:
          VOLUMUTE_RELEASE: "1"
          VOLUMUTE_VERSION: ${{ steps.versions.outputs.unlisted }}

      - name: Create Release (full)
        if: ${{ steps.versions.outputs.mode == 'full' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/volumute-chrome.zip
            dist/volumute-firefox.zip

      - name: Create Release (unlisted-only)
        if: ${{ steps.versions.outputs.mode == 'unlisted' }}
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: |
            dist/volumute-chrome.zip

      - name: Sign unlisted version on AMO
        run: |
          pnpm exec web-ext sign \
            --channel=unlisted \
            --approval-timeout=1800000 \
            --source-dir dist/firefox \
            --artifacts-dir dist/signed \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET"
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}

      - name: Tag unlisted version
        if: ${{ steps.versions.outputs.mode == 'full' }}
        run: |
          if git ls-remote --exit-code origin "refs/tags/v${UNLISTED}" >/dev/null 2>&1; then
            echo "Tag v${UNLISTED} already exists, skipping."
          else
            git tag "v${UNLISTED}"
            git push origin "v${UNLISTED}"
          fi
        env:
          UNLISTED: ${{ steps.versions.outputs.unlisted }}

      - name: Attach unlisted XPI to Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.versions.outputs.mode == 'unlisted' }}
          files: |
            dist/signed/*.xpi
